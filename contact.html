<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klant Demo | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Klant<span>Demo</span></a>
    <nav aria-label="Hoofdnavigatie">
      <a href="index.html">Home</a>
      <a href="about.html">Over ons</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="content-section narrow">
    <p class="eyebrow">We horen graag van je</p>
    <h1>Contact</h1>
    <p>Heb je een vraag of wil je meer informatie? Neem contact met ons op.</p>
    <div class="contact-card">
      <p><strong>E-mail:</strong> info@klantdemo.nl</p>
      <p><strong>Telefoon:</strong> 06 12345678</p>
      <p class="note">Dit zijn voorbeeldgegevens voor deze oefenwebsite.</p>
    </div>
    <h2>Stuur een bericht</h2>
    <form class="contact-form" action="#" method="get">
      <label for="name">Naam</label>
      <input id="name" name="name" type="text" placeholder="Je naam">
      <label for="email">E-mailadres</label>
      <input id="email" name="email" type="email" placeholder="naam@voorbeeld.nl">
      <label for="message">Bericht</label>
      <textarea id="message" name="message" rows="4" placeholder="Typ je bericht"></textarea>
      <button class="button" type="submit">Verstuur</button>
    </form>
  </main>
  <footer><p>&copy; 2026 Klant Demo. Dit is een oefenwebsite.</p></footer>
</body>
</html>
